site_name: StarNavigator 使い方マニュアル
site_description: ホロスコープ作成ソフト StarNavigator（スタナビ）の使い方ガイド
site_url: https://manual.starnavi.arijp.com/

# 使い方（操作方法）のみを扱う。占星術の解釈・知識（α）は載せない。

theme:
  name: material
  language: ja
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: ライトモードに切り替え
  features:
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

# プラグイン順序に意味がある。print-site を i18n より先に置くこと。
# 逆順だと英語版の印刷ページ（/en/print_page/）が生成されず、日本語の印刷ページに
# リンクしてしまう。
plugins:
  - search:
      lang:
        - ja
        - en
  - print-site:
      add_cover_page: true
      cover_page_template: "docs/assets/templates/print_cover.tpl"
      add_to_navigation: true
      print_page_title: "印刷 / PDF（全体）"
  # 画像をクリック／タップで拡大表示（全章の既存画像にそのまま効く。md の書き換え不要）。
  # print-site の *後* に置くこと。前に置くと印刷ページの画像まで <a> でくるまれ、
  # 印刷ページには glightbox の js/css が入らないため「クリックすると画像ファイルへ飛ぶ」
  # だけの壊れたリンクになる。
  - glightbox:
      touchNavigation: true
      effect: zoom
      zoomable: true
      draggable: false
      auto_caption: false
  # 日本語＝ルート（既存URLを維持） / 英語＝/en/ 配下。翻訳ファイルは suffix 規約（xxx.en.md）。
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: ja
          default: true
          name: 日本語
          build: true
        - locale: en
          name: English
          build: true
          site_name: StarNavigator User Manual
          site_description: A guide to using StarNavigator, the horoscope charting software
          nav_translations:
            "印刷 / PDF（全体）": "Print / PDF (all pages)"
          # 章名は製品の英語メニュー表記に合わせる（利用者が画面で探せるように）。
          # NotebookLM は英語ソース（stanavi-manual-all.en.md）を読ませた別ノートブック。
          # ビギナー(英語UI非公開)と未來予報カレンダー(日本語のみの商品)の章は英語ナビに載せない
          nav:
            - Home: index.md
            - Header and LISA Guide: open-chart.md
            - Astrology Basics: basics.md
            - Natal: single-chart.md
            - Synastry: double-chart.md
            - Progression: triple-chart.md
            - Harmonic: harmonic.md
            - Return: return-chart.md
            - Timeline: timeline.md
            - Traditional (Profections and Lots): traditional.md
            - Forecast: forecast.md
            - AI Report / LISA Chat: ai-report.md
            - Astro Map: astro-map.md
            - Multi-Chart: multi-chart.md
            - Election: election.md
            - Ephemeris: ephemeris.md
            - Clients: birth-data.md
            - Settings: settings.md
            - Plan and Credits: plan-credits.md
            - Readings: shop.md
            - Ask AI how to use StarNavigator: https://notebooklm.google.com/notebook/a60e1cf7-f23c-491a-889f-5c6ed5bec955

# print-site の出力先を言語ごとに振り分ける（詳細はフック内のコメント参照）。
hooks:
  - hooks/print_site_i18n.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

extra_javascript:
  - javascripts/external-links.js

extra:
  manual_date: "2026年7月版"
  manual_date_en: "July 2026 Edition"
  analytics:
    provider: google
    property: G-EJZX3CCNF5

nav:
  - ホーム: index.md
  - ビギナー: beginner.md
  - ヘッダーとLISAガイド: open-chart.md
  - 占星術の基礎知識: basics.md
  - 一重円: single-chart.md
  - 二重円: double-chart.md
  - 三重円: triple-chart.md
  - ハーモニック: harmonic.md
  - リターン図: return-chart.md
  - 年表: timeline.md
  - 古典（プロフェクション・ロット）: traditional.md
  - 未来予測: forecast.md
  - AIレポート・LISAチャット: ai-report.md
  - アストロマップ: astro-map.md
  - マルチチャート: multi-chart.md
  - イレクション: election.md
  - 天文暦: ephemeris.md
  - 出生データ: birth-data.md
  - 設定: settings.md
  - プラン・クレジット: plan-credits.md
  - 占い・鑑定: shop.md
  - 未來予報カレンダー: forecast-calendar.md
  - AIに使い方を聞く: https://notebooklm.google.com/notebook/ba28c68e-c7c0-4a81-88b0-dfbf4872da70
